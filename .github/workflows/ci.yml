name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: Testes unitários (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [auth-service, boleto-risk-engine, email-scanner-service]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: ${{ matrix.module }}/pom.xml
      - name: Rodar testes
        run: mvn -B -ntp test
        working-directory: ${{ matrix.module }}
      - name: Publicar relatório JUnit
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}
        with:
          name: Resultado dos testes (${{ matrix.module }})
          path: ${{ matrix.module }}/target/surefire-reports/TEST-*.xml
          reporter: java-junit
          fail-on-empty: false
      - name: Guardar XML como artefato
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: junit-results-${{ matrix.module }}
          path: ${{ matrix.module }}/target/surefire-reports/TEST-*.xml
          if-no-files-found: ignore

  build:
    name: Build (${{ matrix.module }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [auth-service, boleto-risk-engine, email-scanner-service]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: ${{ matrix.module }}/pom.xml
      - name: Build do JAR
        run: mvn -B -ntp clean package -DskipTests
        working-directory: ${{ matrix.module }}
      - name: Guardar JAR
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.module }}
          path: ${{ matrix.module }}/target/*.jar
          if-no-files-found: error

  docker:
    name: Build das imagens Docker
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose build
        run: docker compose build