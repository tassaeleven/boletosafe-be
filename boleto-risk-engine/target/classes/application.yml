spring:
  application:
    name: boleto-risk-engine
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:boletosafe_risk}
    username: ${DB_USER:boletosafe}
    password: ${DB_PASSWORD:boletosafe}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: ${SERVER_PORT:8082}

boletosafe:
  jwt:
    secret: ${JWT_SECRET:boletosafe-super-secret-key-troque-em-producao-0000}

management:
  endpoints:
    web:
      exposure:
        include: health
